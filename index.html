<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7C5CFF">
  <meta name="description" content="移动端颜文字管理：分类浏览、搜索、一键复制、收藏与最近使用、自定义增删改、本地备份。">
  <title>颜文字管理</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="title">颜文字</h1>
      <button class="icon-btn" id="menuBtn" aria-label="设置">⋮</button>
    </header>

    <div class="searchbar">
      <input id="search" type="search" placeholder="搜索颜文字 / 标签 / 分类" autocomplete="off" enterkeyhint="search">
    </div>

    <nav class="chips" id="chips" aria-label="筛选"></nav>

    <main class="list" id="list"></main>

    <button class="fab" id="addBtn" aria-label="新增颜文字">＋</button>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
